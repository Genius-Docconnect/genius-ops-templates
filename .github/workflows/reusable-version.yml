name: Reusable · Version

# Calcule la version x.y.z d'un merge (décision genius-ops-delivery 2026-10-09-branches-versions-environnements) :
#   - chaque merge sur la branche principale monte le chiffre du milieu : v1.41.0 → 1.42.0 ;
#   - une branche hotfix/X.Y (créée depuis le tag vX.Y.Z) donne X.Y.(Z+1) ;
#   - le premier chiffre monte à la main : ligne `Release-As: 2.0.0` dans le message du merge ;
#   - une relance d'un run déjà tagué garde sa version.
#
# Sorties :
#   version : vide = rien à livrer (création d'une branche hotfix depuis son tag) ;
#   base    : tag de la version précédente (vide pour la première) ; à utiliser pour savoir
#             ce qui a changé (`git diff $base..HEAD`) et comme source du retag.
#
# Usage (premier job du workflow, push sur main et hotfix/** uniquement) :
#
#   jobs:
#     version:
#       uses: Genius-Docconnect/genius-ops-templates/.github/workflows/reusable-version.yml@v1
#       with:
#         first-version: 1.0.0
#
# Suite de la chaîne : construire les images modifiées, taguées sha et version, puis
# reusable-release.yml (retag des autres, tag Git, release), puis reusable-promote-deploy.yml.

on:
  workflow_call:
    inputs:
      first-version:
        type: string
        default: '1.0.0'
        description: 'Version donnée au premier merge, quand aucun tag vX.Y.0 n existe'
    outputs:
      version:
        description: 'Version de ce run (vide = rien à livrer)'
        value: ${{ jobs.version.outputs.version }}
      base:
        description: 'Tag de la version précédente (vide si aucune)'
        value: ${{ jobs.version.outputs.base }}

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          FIRST_VERSION: ${{ inputs.first-version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$FIRST_VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]] || { echo "first-version doit être X.Y.0 (reçu : $FIRST_VERSION)" >&2; exit 1; }

          # Correctif : hotfix/X.Y part du tag vX.Y.Z en prod → X.Y.(Z+1).
          if [[ "$GITHUB_REF" == refs/heads/hotfix/* ]]; then
            LINE="${GITHUB_REF#refs/heads/hotfix/}"
            MATCH="v${LINE}.[0-9]*"
            EXISTING=$(git tag --points-at HEAD --list "$MATCH" | head -1)
            if [[ -n "$EXISTING" && "$RUN_ATTEMPT" == "1" ]]; then
              # Création de la branche depuis le tag : rien de nouveau à livrer.
              echo "HEAD = $EXISTING : rien à construire (création de la branche)." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ -n "$EXISTING" ]]; then
              VERSION="${EXISTING#v}"
              BASE=$(git describe --tags --abbrev=0 --match "$MATCH" HEAD^ 2>/dev/null || true)
            else
              BASE=$(git describe --tags --abbrev=0 --match "$MATCH" HEAD 2>/dev/null || true)
              [[ -n "$BASE" ]] || { echo "hotfix/${LINE} doit partir d'un tag v${LINE}.Z (ex. git switch -c hotfix/${LINE} v${LINE}.0)" >&2; exit 1; }
              IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE#v}"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "Correctif : $VERSION (depuis $BASE)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MATCH='v[0-9]*.[0-9]*.0'

          # Relance d'un run déjà versionné : on garde sa version.
          EXISTING=$(git tag --points-at HEAD --list "$MATCH" | head -1)
          if [[ -n "$EXISTING" ]]; then
            VERSION="${EXISTING#v}"
            BASE=$(git describe --tags --abbrev=0 --match "$MATCH" HEAD^ 2>/dev/null || true)
          else
            BASE=$(git describe --tags --abbrev=0 --match "$MATCH" HEAD 2>/dev/null || true)
            RELEASE_AS=$(git log -1 --format=%B | sed -n 's/^Release-As: *\([0-9]\+\.0\.0\) *$/\1/p' | head -1)
            if [[ -z "$BASE" ]]; then
              VERSION="$FIRST_VERSION"
            else
              IFS='.' read -r MAJOR MINOR _ <<< "${BASE#v}"
              VERSION="${MAJOR}.$((MINOR + 1)).0"
            fi
            if [[ -n "$RELEASE_AS" ]]; then
              [[ "${RELEASE_AS%%.*}" -gt "${VERSION%%.*}" ]] || { echo "Release-As $RELEASE_AS doit monter le premier chiffre (actuel : $VERSION)" >&2; exit 1; }
              VERSION="$RELEASE_AS"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION (précédente : ${BASE:-aucune})" | tee -a "$GITHUB_STEP_SUMMARY"
