name: Reusable · Docker build & push

# Wraps buildx setup, registry login, tagging and build-push-action with the
# GHA cache. Project-specific logic (which tag for which branch, whether to
# push at all) stays in the calling workflow via the `tags` / `push` inputs.
#
# Usage from a project's own workflow:
#
#   jobs:
#     publish:
#       needs: build
#       uses: FNTEC/ops-templates/.github/workflows/reusable-docker-build-push.yml@v1
#       with:
#         image: ghcr.io/fntec/fntecapi
#         tags: staging,sha-${{ github.sha }}
#       secrets:
#         registry-username: ${{ github.actor }}
#         registry-password: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
        description: 'Full image name without tag, e.g. ghcr.io/org/app'
      registry:
        type: string
        default: 'ghcr.io'
      context:
        type: string
        default: '.'
      dockerfile:
        type: string
        default: 'Dockerfile'
      tags:
        type: string
        required: true
        description: 'Comma-separated tags, e.g. "staging,sha-abc123"'
      push:
        type: boolean
        default: true
    secrets:
      registry-username:
        required: true
      registry-password:
        required: true

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Compute full tags
        id: tags
        run: |
          set -euo pipefail
          IFS=',' read -ra RAW <<< "${{ inputs.tags }}"
          FULL=()
          for t in "${RAW[@]}"; do
            t="$(echo "$t" | xargs)"
            [[ -z "$t" ]] && continue
            FULL+=("${{ inputs.image }}:$t")
          done
          if [[ ${#FULL[@]} -eq 0 ]]; then
            echo "No usable tags parsed from inputs.tags='${{ inputs.tags }}'" >&2
            exit 1
          fi
          ( IFS=','; echo "list=${FULL[*]}" ) >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
