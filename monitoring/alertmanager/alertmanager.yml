# Template rendered by envsubst (alertmanager-config init container):
# Alertmanager does not expand environment variables in its own config.
global:
  smtp_smarthost: '${ALERT_SMTP_HOST}'
  smtp_from: '${ALERT_SMTP_FROM}'
  smtp_auth_username: '${ALERT_SMTP_USERNAME}'
  smtp_auth_password: '${ALERT_SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: email-default
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: email-default
      repeat_interval: 1h

receivers:
  - name: email-default
    email_configs:
      # Comma-separated list accepted.
      - to: '${ALERT_RECIPIENTS}'
        send_resolved: true
